name: Build Smart View telemetry DLL
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official SCS Telemetry SDK 1.16
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://download.eurotrucksimulator2.com/scs_sdk_1_16.zip' -OutFile scs_sdk.zip
          Expand-Archive -Path scs_sdk.zip -DestinationPath scs_sdk -Force
          New-Item -ItemType Directory -Force sdk | Out-Null
          Copy-Item -Path 'scs_sdk/include' -Destination 'sdk/include' -Recurse -Force
          if (!(Test-Path 'sdk/include/scssdk_telemetry.h')) {
            throw 'SCS SDK 1.16 headers were not found after extraction.'
          }
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          msbuild src/smartview_telemetry.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: smartview-telemetry-win-x64
          path: build/smartview_telemetry.dll
          if-no-files-found: error
